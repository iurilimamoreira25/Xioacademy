      { tipo:'intro', texto:'Em um mercado em constante transformação, onde novas competências surgem o tempo todo e a qualificação deixou de ser algo pontual, trabalhar e estudar se tornou parte inevitável da trajetória profissional, mas nem sempre uma tarefa simples.\n\nSó que, com as mudanças nos modelos de trabalho, como a consolidação do formato híbrido e o retorno gradual ao presencial, a rotina perdeu flexibilidade. O tempo que antes parecia disponível para estudar agora é consumido por deslocamentos, agendas mais rígidas e demandas que não dão trégua.\n\nNesse contexto, conciliar trabalho e estudo deixou de depender apenas de força de vontade. Passou a exigir planejamento, método e escolhas conscientes. A seguir, reunimos dicas práticas para manter o aprendizado contínuo de forma sustentável, mesmo em meio a uma rotina intensa.' },

      { tipo:'h2', texto:'O que é Educação 5.0?' },

const GuaranteeSection = () => {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } }, { threshold:.2 });
    obs.observe(el);
    return () => obs.disconnect();

const Navbar = ({ page, setPage }) => {

  const dropRef = useRef(null);
  const isLanding = page === 'landing';

  useEffect(() => {
    if (!isLanding) { setScrolled(true); return; }
    const fn = () => setScrolled(window.scrollY > 20);
    fn();
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, [isLanding]);

  useEffect(() => {
    const fn = e => { if (dropRef.current && !dropRef.current.contains(e.target)) setDropdown(false); };

    return () => document.removeEventListener('mousedown', fn);

              onMouseLeave={e=>{ if(!isSobreActive) e.currentTarget.style.color=C.sec; }}
            >
              Sobre XIO
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" style={{ transition:'transform .2s', transform:dropdown?'rotate(180deg)':'none' }}>

                {[

          {[{ label:'Método', p:'metodo' }].map(l=>(

            style={{ fontSize:'12px', color:'rgba(255,255,255,.4)', textDecoration:'none', letterSpacing:'.04em', transition:'color .15s' }}

      <div style={{ maxWidth:560, margin:'0 auto', textAlign:'center' }}>
        <p style={{ fontSize:'11px', letterSpacing:'.18em', color:C.gold, fontWeight:400, marginBottom:20, textTransform:'uppercase' }}>Ainda tem dúvidas?</p>
        <h2 style={{ fontSize:'clamp(22px,3.5vw,36px)', fontWeight:300, letterSpacing:'-.02em', lineHeight:1.2, marginBottom:20 }}>Fale diretamente com a nossa equipe.</h2>
        <p style={{ fontSize:'15px', color:C.sec, lineHeight:1.7, marginBottom:36 }}>Respondemos em até 24 horas em dias úteis.</p>
        <div style={{ display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap' }}>
          <GoldBtn onClick={()=>window.location.href='mailto:technologiesxio@gmail.com'} style={{ padding:'12px 28px', fontSize:'13px', letterSpacing:'.06em' }}>
            Enviar e-mail
          </GoldBtn>
          <GhostBtn onClick={()=>setPage('planos')}>Ver o método →</GhostBtn>
        </div>
      </div>
    </section>

    <Footer setPage={setPage} />
  </div>
);

// ── App ───────────────────────────────────────────────────────────────────────
// ── Artigo Page ───────────────────────────────────────────────────────────────
const ArtigoPage = ({ setPage, artigoId }) => {
  const artigo = ARTIGOS[artigoId];
  if (!artigo) return null;

  const renderBloco = (bloco, i) => {
    switch (bloco.tipo) {
      case 'paragrafo':
        return <p key={i} style={{ fontSize:16, lineHeight:1.82, color:'rgba(255,255,255,.74)', marginBottom:22, fontWeight:300 }}>{bloco.texto}</p>;
      case 'h2':
        return <h2 key={i} style={{ fontFamily:SERIF, fontSize:'clamp(22px,2.8vw,28px)', fontWeight:400, color:C.text, lineHeight:1.3, marginTop:52, marginBottom:18, letterSpacing:'-.01em' }}>{bloco.texto}</h2>;
      case 'h3':
        return <h3 key={i} style={{ fontFamily:SERIF, fontSize:'clamp(17px,2vw,21px)', fontWeight:400, color:C.gold, lineHeight:1.3, marginTop:38, marginBottom:12, letterSpacing:'-.01em' }}>{bloco.texto}</h3>;
      case 'prompt':
        return (
          <div key={i} style={{ background:'rgba(200,169,110,.06)', borderLeft:`2px solid ${C.gold}`, padding:'20px 26px', margin:'24px 0', borderRadius:'0 6px 6px 0' }}>
            <p style={{ fontSize:15, fontStyle:'italic', color:'rgba(255,255,255,.86)', lineHeight:1.75, margin:0, whiteSpace:'pre-line' }}>{bloco.texto}</p>
          </div>
        );
      case 'lista':
        return (
          <ul key={i} style={{ padding:0, margin:'16px 0 24px', listStyle:'none' }}>
            {bloco.items.map((item, j) => (
              <li key={j} style={{ display:'flex', gap:12, alignItems:'flex-start', marginBottom:10 }}>
                <span style={{ color:C.gold, fontSize:11, marginTop:5, flexShrink:0 }}>✓</span>
                <span style={{ fontSize:15, color:'rgba(255,255,255,.72)', lineHeight:1.65, fontWeight:300 }}>{item}</span>
              </li>
            ))}
          </ul>
        );
      case 'intro':
        return (
          <div key={i} style={{ margin:'0 0 32px', paddingBottom:32, borderBottom:`0.5px solid rgba(255,255,255,.07)` }}>
            {bloco.texto.split('\n\n').map((p, j) => (
              <p key={j} style={{ fontSize:'clamp(16px,1.6vw,18px)', lineHeight:1.82, color:'rgba(255,255,255,.68)', marginBottom:j < bloco.texto.split('\n\n').length-1 ? 20 : 0, fontWeight:300 }}>{p}</p>
            ))}
          </div>
        );
      case 'cta':
        return (
          <div key={i} style={{ margin:'52px 0 0', padding:'36px 40px', background:'rgba(200,169,110,.05)', border:`0.5px solid rgba(200,169,110,.22)`, borderRadius:10, textAlign:'center' }}>
            <p style={{ fontSize:'10px', letterSpacing:'.22em', color:C.gold, textTransform:'uppercase', marginBottom:14, fontWeight:400 }}>XIO Academy</p>
            <h3 style={{ fontFamily:SERIF, fontSize:'clamp(20px,2.5vw,26px)', fontWeight:400, color:C.text, lineHeight:1.25, marginBottom:12 }}>
              {bloco.titulo || 'Quer aprender IA aplicada na prática?'}
            </h3>
            <p style={{ fontSize:14, color:C.sec, lineHeight:1.7, marginBottom:28, fontWeight:300 }}>
              {bloco.subtitulo || 'A XIO Academy ensina o caminho completo — do primeiro prompt ao primeiro cliente usando IA.'}
            </p>
            <GoldBtn onClick={()=>setPage('planos')} style={{ padding:'12px 32px', fontSize:'12px', letterSpacing:'.08em' }}>
              {bloco.botao || 'Ver planos →'}
            </GoldBtn>
          </div>
        );
      default: return null;
    }
  };

  const relacionados = CONTEUDOS.filter(c => c.id !== artigoId).slice(0, 3);

  return (
    <div style={{ background:'#050505', minHeight:'100vh' }}>

      {/* Ambient glow */}
      <div style={{ position:'fixed', top:'10%', left:'50%', transform:'translateX(-50%)', width:700, height:500, background:'radial-gradient(ellipse, rgba(200,169,110,.03) 0%, transparent 68%)', pointerEvents:'none', zIndex:0 }} />

      <div style={{ maxWidth:800, margin:'0 auto', padding:'clamp(100px,12vw,140px) clamp(28px,5vw,48px) 0', position:'relative', zIndex:1 }}>

        {/* Breadcrumb */}
        <button onClick={()=>setPage('gratuitos')}
          style={{ background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', display:'inline-flex', alignItems:'center', gap:8, marginBottom:40, color:'rgba(255,255,255,.45)', fontSize:12, letterSpacing:'.04em', transition:'color .2s', padding:0 }}
          onMouseEnter={e=>e.currentTarget.style.color=C.gold}
          onMouseLeave={e=>e.currentTarget.style.color='rgba(255,255,255,.45)'}
        >
          ← Voltar para conteúdos gratuitos
        </button>

        {/* Header */}
        <header style={{ marginBottom:40 }}>
          <span style={{ display:'inline-block', color:C.gold, fontSize:'9px', letterSpacing:'.2em', textTransform:'uppercase', marginBottom:18, fontWeight:400 }}>{artigo.categoria}</span>
          <h1 style={{ fontFamily:SERIF, fontSize:'clamp(28px,4.5vw,48px)', fontWeight:400, color:'#f5f5f5', lineHeight:1.12, letterSpacing:'-.02em', marginBottom:24 }}>{artigo.titulo}</h1>
          <div style={{ display:'flex', alignItems:'center', flexWrap:'wrap', gap:6, marginBottom:32 }}>
            <span style={{ fontSize:12, color:'rgba(255,255,255,.38)', fontWeight:300 }}>Por {artigo.autor}</span>
            <span style={{ color:'rgba(200,169,110,.4)', fontSize:10 }}>◆</span>
            <span style={{ fontSize:12, color:'rgba(255,255,255,.38)', fontWeight:300 }}>{artigo.data}</span>
            <span style={{ color:'rgba(200,169,110,.4)', fontSize:10 }}>◆</span>
            <span style={{ fontSize:12, color:'rgba(255,255,255,.38)', fontWeight:300 }}>{artigo.tempoLeitura} de leitura</span>
          </div>
          <div style={{ width:60, height:1, background:`linear-gradient(to right, ${C.gold}, transparent)`, opacity:.7 }} />
        </header>

        {/* Imagem destaque placeholder */}
        <div style={{ width:'100%', aspectRatio:'16/9', background:CARD_PLACEHOLDER[artigo.categoria]||'#111', borderRadius:10, marginBottom:48, overflow:'hidden', position:'relative' }}>
          <div style={{ position:'absolute', inset:0, background:'linear-gradient(135deg, rgba(200,169,110,.08) 0%, transparent 60%)' }} />
          <div style={{ position:'absolute', bottom:20, left:24, fontSize:'10px', letterSpacing:'.2em', color:'rgba(200,169,110,.5)', textTransform:'uppercase' }}>{artigo.categoria}</div>
        </div>

        {/* Corpo do artigo */}
        <article style={{ marginBottom:72 }}>
          {artigo.blocos.map((bloco, i) => renderBloco(bloco, i))}
        </article>

        {/* Autor */}
        <div style={{ display:'flex', alignItems:'center', gap:20, padding:'28px 32px', background:'rgba(255,255,255,.025)', borderRadius:10, border:'0.5px solid rgba(255,255,255,.06)', marginBottom:72 }}>
          <div style={{ width:52, height:52, borderRadius:'50%', background:`linear-gradient(135deg,${C.gold},#8a6a2e)`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:16, fontWeight:400, color:'#0a0a0a', fontFamily:SERIF }}>IM</div>
          <div>
            <p style={{ fontSize:14, color:C.text, fontWeight:400, marginBottom:4 }}>Iuri Moreira</p>
            <p style={{ fontSize:12, color:'rgba(255,255,255,.4)', fontWeight:300, lineHeight:1.6 }}>Co-fundador da XIO Academy · Especialista em IA aplicada a negócios e educação.</p>
          </div>
        </div>

        {/* Relacionados */}
        {relacionados.length > 0 && (
          <section style={{ marginBottom:80 }}>
            <p style={{ fontSize:'10px', letterSpacing:'.22em', color:'rgba(255,255,255,.35)', textTransform:'uppercase', marginBottom:24, fontWeight:400 }}>Continue lendo</p>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))', gap:16 }}>
              {relacionados.map(c => (
                <div key={c.id}
                  onClick={()=>setPage('gratuitos')}
                  style={{ position:'relative', borderRadius:10, overflow:'hidden', cursor:'pointer', aspectRatio:'4/3', background:CARD_PLACEHOLDER[c.categoria]||'#111', border:'0.5px solid rgba(255,255,255,.05)', transition:'transform .35s, box-shadow .35s' }}
                  onMouseEnter={e=>{ e.currentTarget.style.transform='translateY(-4px)'; e.currentTarget.style.boxShadow='0 16px 48px rgba(0,0,0,.5), 0 0 24px rgba(200,169,110,.06)'; }}
                  onMouseLeave={e=>{ e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.boxShadow='none'; }}
                >
                  <div style={{ position:'absolute', inset:0, background:'linear-gradient(to top, rgba(5,5,5,.95) 0%, transparent 60%)', zIndex:1 }} />
                  <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'16px 18px', zIndex:2 }}>
                    <span style={{ display:'block', fontSize:'8.5px', letterSpacing:'.18em', color:C.gold, textTransform:'uppercase', marginBottom:6 }}>{c.categoria}</span>
                    <p style={{ fontFamily:SERIF, fontSize:13, color:'#f0f0f0', lineHeight:1.3, fontWeight:400 }}>{c.titulo}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>
        )}

      </div>

      <Footer setPage={setPage} />
    </div>
  );
};

function App() {
  const [page, setPage]           = useState('landing');
  const [artigoAtivo, setArtigoAtivo] = useState(null);

  useEffect(() => { window.scrollTo(0, 0); }, [page]);

  const navegar = (p, id=null) => { setPage(p); if(id) setArtigoAtivo(id); };

  return (
    <div style={{ minHeight:'100vh', background:C.bg }}>
      <Navbar page={page} setPage={setPage} />
      <div key={page} className="page-in">
        {page==='landing'    && <LandingPage    setPage={setPage} />}
        {page==='sobre'      && <SobrePage      setPage={setPage} />}
        {page==='metodo'     && <MetodoPage     setPage={setPage} />}
        {page==='resultados' && <ResultadosPage setPage={setPage} />}
        {page==='gratuitos'  && <GratuitosPage  setPage={setPage} navegar={navegar} />}
        {page==='faq'        && <FaqPage        setPage={setPage} />}
        {page==='planos'     && <PlanosPage     setPage={setPage} />}
        {page==='artigo'     && <ArtigoPage     setPage={setPage} artigoId={artigoAtivo} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
